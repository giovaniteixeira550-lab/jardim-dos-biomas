<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Proposta de pontes de madeira · verificações</title><style>body{background:#141c18;color:#e9e3d1;font:16px system-ui;margin:24px}canvas{width:800px;height:480px;max-width:100%}li{margin:10px}button{padding:8px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
<h1>Proposta local · madeira e percurso removido</h1><button id="executar">Executar verificações</button><p id="estado">Aguardando</p><ol id="resultados"></ol><canvas id="canvas"></canvas>
<script type="module">
import * as THREE from 'three';import {Jardim} from '../src/cena.js';
const $=id=>document.getElementById(id),ok=(v,m)=>{if(!v)throw Error(m)},passou=m=>{const li=document.createElement('li');li.textContent='PASSOU — '+m;$('resultados').append(li)};
$('executar').onclick=async()=>{try{
$('executar').disabled=true;const j=new Jardim($('canvas'));await j.carregar(1234,(_,m)=>$('estado').textContent=m);cancelAnimationFrame(j.raf);j.raf=null;j.scene.updateMatrixWorld();
const m=j.mundo,p=m.plano.passarela,wood=[];j.travessias.traverse(o=>{if(o.userData.tipo==='ponte-madeira')wood.push(o)});
ok(wood.length===2,'faltam pontes de madeira');ok(!j.travessias.getObjectByName('ponte-pedra-0'),'ponte de pedra permaneceu');
for(const b of wood){ok(b.children.length===1,'excesso de malhas na ponte');for(const n of b.children[0].geometry.attributes.position.array)ok(Number.isFinite(n),'vértice inválido');}
passou('Duas pontes de madeira, uma malha por ponte, sem ponte de pedra ou vértices inválidos.');
for(const q of [[15,76],[24,58],[17,43],[21,32]])ok(m.distTrilha(q[0]/180*m.largura,q[1]/120*m.altura)>5,'percurso antigo continua marcado');
passou('Percurso longo e suas escadas removidos; acesso pelo lado das cascatas preservado.');
for(const q of [p.inicio,p.fim])ok(Math.abs(m.altitude(q.x,q.y)-p.altura)<.15,'cabeceira sem terreno de apoio');
const cx=(p.inicio.x+p.fim.x)/2,cy=(p.inicio.y+p.fim.y)/2;ok(p.altura-m.altitude(cx,cy)>3,'ponte aterrada no vale');
passou('Cabeceiras apoiadas nos dois platôs; vão livre sobre o vale.');
const b=wood.find(b=>b.name==='ponte-madeira-proposta');ok(b.userData.tabuas>200,'tábuas largas demais');
const geo=b.children[0].geometry.attributes.position;let max=0;for(let i=0;i<geo.count;i+=3){const tri=[0,1,2].map(k=>new THREE.Vector3().fromBufferAttribute(geo,i+k));for(let k=0;k<3;k++)max=Math.max(max,tri[k].distanceTo(tri[(k+1)%3]));}ok(max<.55,'face grande demais: '+max);
passou(b.userData.tabuas+' peças de tabuleiro, '+b.userData.pecas+' peças de madeira e metal; arestas das faces menores que 0,55 m.');
const ray=new THREE.Raycaster();for(const t of [.001,.101,.501,.901,.999]){const x=p.inicio.x+(p.fim.x-p.inicio.x)*t,y=p.inicio.y+(p.fim.y-p.inicio.y)*t,h=p.altura+p.arqueamento*Math.sin(Math.PI*t);ray.set(new THREE.Vector3(x,h+1,y),new THREE.Vector3(0,-1,0));const hit=ray.intersectObject(b,true)[0];ok(hit&&Math.abs(hit.point.y-h)<.08,'piso ausente ou flutuante');}
passou('Tabuleiro com altura coerente entre cabeceiras e centro.');
j.irParaLocal('ponte-madeira');j.quadroAnim();$('estado').textContent='Todas as 5 verificações da proposta passaram.';
}catch(e){$('estado').textContent='FALHOU — '+e.message;console.error(e)}};
</script></html>
