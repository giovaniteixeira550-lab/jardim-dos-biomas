<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Verificação de água e lago</title><style>body{background:#141c18;color:#e9e3d1;font:16px system-ui;margin:24px}canvas{width:800px;height:480px}li{margin:10px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script><h1>Água, lago e entradas da ponte</h1><button id="executar">Executar verificações</button><p id="estado">Aguardando</p><ol id="resultados"></ol><canvas id="canvas"></canvas><script type="module">
import {Jardim} from '../src/cena.js';
const $=id=>document.getElementById(id),ok=(v,m)=>{if(!v)throw Error(m)},passou=m=>{const li=document.createElement('li');li.textContent='PASSOU — '+m;$('resultados').append(li)};
$('executar').onclick=async()=>{try{$('executar').disabled=true;const j=new Jardim($('canvas'));await j.carregar(1234,(_,m)=>$('estado').textContent=m);cancelAnimationFrame(j.raf);j.raf=null;const m=j.mundo,g=j.agua.geometry;
let acessos=0;j.travessias.traverse(o=>{if(o.userData.tipo==='escada'&&o.userData.material==='madeira'){ok(!o.children.some(c=>c.userData.tipo==='mureta-escada'),'restou mureta de pedra');acessos++;}});ok(acessos===2,'faltam acessos de madeira');passou('Duas entradas da ponte em madeira, sem muretas de pedra.');
ok(!j.agua.material.transparent&&j.agua.material.polygonOffsetFactor===0,'superfície ou prioridade de profundidade incorreta');const pos=g.attributes.position;ok(pos.count>1000,'malha pouco refinada');for(let i=0;i<pos.count;i++)ok(Math.abs(pos.getY(i)+.55)<1e-5,'lago deixou de ser horizontal');
const prof=g.attributes.aFundo.array;ok(prof.every(x=>x>=0&&x<=1)&&Math.max(...prof)>.9&&Math.min(...prof)<.1,'faltam zonas profundas ou rasas');passou('Superfície horizontal, malha refinada e faixas de profundidade válidas.');
const foz=m.riacho.pontos.at(-1);ok(m.altitude(foz.x,foz.y)<-1.8,'canal criou uma elevação no fundo do lago');const banco=j.aguaPercurso.getObjectByName('bordas-grama-riacho').geometry.attributes.position;for(let i=0;i<banco.count;i++)ok(m.fatorLago(banco.getX(i),banco.getZ(i))>.95,'barranco invade o interior do lago');passou('Riacho encontra o lago sem elevar o fundo ou prolongar barrancos em seu interior.');
j.irParaLocal('lago');for(const hora of ['dia','entardecer','noite']){j.setHora(hora);j.quadroAnim();ok(j.agua.material.userData.shader,'material não compilou');ok(j.agua.material.userData.shader.uniforms.uTime.value>=0,'animação inválida');}passou('Água compilada e renderizada de dia, ao entardecer e à noite.');
let n=0;const recursos=new Set();j.scene.traverse(o=>{if(o.geometry)recursos.add(o.geometry)});for(const r of recursos)r.addEventListener('dispose',()=>n++);j.dispose();j.dispose();ok(n===recursos.size,'recursos liberados incorretamente');passou('Recursos da água liberados uma única vez.');$('estado').textContent='Todas as 5 verificações passaram.';}catch(e){$('estado').textContent='FALHOU — '+e.message;console.error(e)}};
</script></html>
