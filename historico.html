<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Histórico do Jardim</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&display=swap" rel="stylesheet" />
<style>
  /* Página de leitura: coluna única, mesma identidade da demo (painéis de jogo). */
  :root {
    --tinta: #141c18;
    --painel: #1b2620;
    --borda: #3f6e3c;
    --texto: #e9e3d1;
    --suave: #a6b67f;
    --acento: #9cc364;
    --alerta: #ecab4c;
    --display: "Silkscreen", "Pixelify Sans", ui-monospace, monospace;
    --corpo: "Pixelify Sans", ui-monospace, "Cascadia Mono", monospace;
    color-scheme: dark;
  }
  body { margin: 0; background: var(--tinta); color: var(--texto); font-family: var(--corpo); font-size: 16px; line-height: 1.6; }
  .topo { position: sticky; top: 0; z-index: 2; background: var(--tinta); border-bottom: 2px solid var(--borda); padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .topo strong { font-family: var(--display); font-weight: 400; color: var(--acento); letter-spacing: 0.06em; font-size: 14px; }
  .topo a { color: var(--texto); background: #22382b; border: 2px solid var(--borda); padding: 3px 10px; text-decoration: none; box-shadow: 2px 2px 0 #000; font-size: 13px; }
  main { max-width: 760px; margin: 0 auto; padding: 8px 16px 48px; }
  h1 { font-family: var(--display); font-weight: 400; color: var(--acento); font-size: 22px; letter-spacing: 0.05em; text-wrap: balance; }
  h2 { font-family: var(--display); font-weight: 400; color: var(--alerta); font-size: 16px; letter-spacing: 0.05em; margin-top: 40px; border-top: 2px dashed var(--borda); padding-top: 18px; }
  h3 { font-size: 18px; color: var(--texto); margin: 28px 0 6px; }
  a { color: var(--acento); }
  code { background: var(--painel); padding: 0 4px; border: 1px solid var(--borda); font-size: 0.9em; }
  img { display: block; max-width: 100%; margin: 12px 0; border: 2px solid var(--borda); image-rendering: pixelated; box-shadow: 4px 4px 0 #000; }
  ul, ol { padding-left: 22px; }
  li { margin: 3px 0; }
  hr { border: 0; border-top: 2px solid var(--borda); margin: 28px 0; }
  #erro { color: var(--alerta); }
</style>
</head>
<body>
<header class="topo">
  <strong>HISTÓRICO DO JARDIM</strong>
  <a href="./">← Voltar ao jardim</a>
</header>
<main id="conteudo"><p>Carregando o histórico…</p></main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  // Fonte única: HISTORICO.md (o mesmo arquivo que as IAs e você editam).
  fetch("HISTORICO.md", { cache: "no-store" })
    .then((r) => (r.ok ? r.text() : Promise.reject(new Error(`HTTP ${r.status}`))))
    .then((md) => {
      document.getElementById("conteudo").innerHTML = marked.parse(md);
    })
    .catch((e) => {
      document.getElementById("conteudo").innerHTML = `<p id="erro">Não foi possível carregar o histórico (${e.message}). Ele também está em HISTORICO.md no repositório.</p>`;
    });
</script>
</body>
</html>
