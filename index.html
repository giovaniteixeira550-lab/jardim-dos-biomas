<style>
  /* Layout: tela cheia de jogo; mapa ao fundo, HUD flutuante (título no topo, painel embaixo). */
  :root {
    --noite: #11162a;
    --tinta: #141c18;
    --painel: rgba(20, 28, 24, 0.86);
    --borda: #3f6e3c;
    --texto: #e9e3d1;
    --suave: #a6b67f;
    --acento: #9cc364;
    --alerta: #ecab4c;
    --display: "Silkscreen", "Pixelify Sans", ui-monospace, monospace;
    --corpo: "Pixelify Sans", ui-monospace, "Cascadia Mono", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--tinta); color: var(--texto); font-family: var(--corpo); overflow: hidden; }
  #mapa { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: grab; touch-action: none; }
  #mapa:active { cursor: grabbing; }

  .hud { position: fixed; z-index: 2; background: var(--painel); border: 2px solid var(--borda); box-shadow: 4px 4px 0 var(--tinta); }
  .titulo { top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; padding: 8px 12px; max-width: calc(100% - 330px); }
  .titulo h1 { margin: 0; font-family: var(--display); font-size: 15px; letter-spacing: 0.06em; color: var(--acento); font-weight: 400; }
  .titulo p { margin: 4px 0 0; font-size: 12px; color: var(--suave); }
  .link-historico { margin-left: 8px; font-family: var(--corpo); font-size: 11px; color: var(--alerta); letter-spacing: 0; vertical-align: middle; }

  .giro { top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; display: flex; gap: 6px; padding: 6px; }
  .ficha { top: calc(64px + env(safe-area-inset-top, 0px)); right: 12px; padding: 8px 12px; min-width: 180px; max-width: calc(100% - 24px); border-color: var(--alerta); }
  .ficha p { margin: 0; }
  .ficha-nome { font-family: var(--display); font-size: 13px; color: var(--alerta); letter-spacing: 0.04em; }
  .ficha-dados { margin-top: 4px !important; font-size: 12px; color: var(--texto); line-height: 1.5; white-space: pre-line; }
  .painel { left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(760px, calc(100% - 24px)); padding: 10px 12px; display: grid; gap: 10px; }
  .linha { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .campo { display: grid; gap: 4px; flex: 1 1 180px; min-width: 0; }
  .campo label { display: flex; justify-content: space-between; font-size: 12px; color: var(--suave); }
  .campo output { color: var(--texto); font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; accent-color: var(--acento); }

  button, .opcao { font-family: var(--corpo); font-size: 13px; color: var(--texto); background: #22382b; border: 2px solid var(--borda); padding: 4px 10px; cursor: pointer; box-shadow: 2px 2px 0 var(--tinta); }
  button:hover { background: #2f5236; }
  button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--tinta); }
  button[aria-pressed="true"] { background: var(--borda); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--alerta); outline-offset: 2px; }
  .grupo { display: flex; gap: 4px; }
  .opcao { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .opcao input { accent-color: var(--acento); margin: 0; }
  .dica { font-size: 11px; color: var(--suave); }

  #carregando { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: radial-gradient(ellipse at center, #22382b 0%, var(--tinta) 72%); padding-inline: 16px; }
  #carregando[hidden] { display: none; }
  .caixa { width: min(420px, 100%); text-align: center; }
  .caixa h2 { font-family: var(--display); font-weight: 400; font-size: 20px; color: var(--acento); margin: 0 0 18px; letter-spacing: 0.06em; }
  .barra { height: 14px; border: 2px solid var(--borda); background: var(--tinta); padding: 2px; box-shadow: 3px 3px 0 #000; }
  .barra > div { height: 100%; width: 3%; background: repeating-linear-gradient(90deg, var(--acento) 0 6px, #75a650 6px 8px); transition: width 0.25s steps(6); }
  #etapa { margin-top: 12px; font-size: 13px; }
  #erro { color: var(--alerta); font-size: 13px; margin-top: 12px; }

  @media (max-width: 560px) {
    .titulo p { display: none; }
    .titulo { max-width: calc(100% - 24px); }
    .giro { top: calc(68px + env(safe-area-inset-top, 0px)); }
    .ficha { top: calc(116px + env(safe-area-inset-top, 0px)); }
    .painel { gap: 8px; padding: 8px; }
    .dica { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .barra > div { transition: none; } }
</style>

<canvas id="mapa" aria-label="Mapa do jardim: clareira com bosque, lago e trilha, em pixel art vista do alto em ângulo"></canvas>

<header class="hud titulo">
  <h1>JARDIM DOS BIOMAS <a class="link-historico" href="historico.html">Histórico</a> <a class="link-historico" href="evolucao.html">Evolução</a> <a class="link-historico" href="planejamento.html">Plano</a></h1>
  <p>Jardim · pontes de madeira · arraste para mover · meio/Shift + arraste = giro · direito + arraste vertical = inclinação · roda/pinça = zoom · passe o mouse na árvore para ver atrás</p>
</header>

<div class="hud giro" role="group" aria-label="Câmera">
  <button id="girar-esq" type="button" title="Girar 45° (Q)" aria-label="Girar câmera para a esquerda">⟲</button>
  <button id="zoom-mais" type="button" title="Aproximar" aria-label="Aproximar">+</button>
  <button id="zoom-menos" type="button" title="Afastar" aria-label="Afastar">−</button>
  <button id="girar-dir" type="button" title="Girar 45° (E)" aria-label="Girar câmera para a direita">⟳</button>
  <button id="recentrar" type="button" title="Voltar à visão inicial" aria-label="Recentrar câmera">⌂</button>
  <button id="viveiro" type="button" aria-pressed="false" title="Ver todas as espécies e estágios">Viveiro</button>
</div>

<aside class="hud ficha" id="ficha" aria-live="polite" hidden>
  <p class="ficha-nome" id="ficha-nome"></p>
  <p class="ficha-dados" id="ficha-dados"></p>
</aside>

<section class="hud painel" aria-label="Controles do jardim">
  <div class="linha">
    <div class="campo">
      <label for="crescimento">Crescimento <output id="v-crescimento">90%</output></label>
      <input id="crescimento" type="range" min="0" max="1" step="0.01" value="0.9" />
    </div>
    <button id="ver-crescer" type="button">▶ Ver crescer</button>
  </div>
  <div class="linha">
    <div class="grupo" role="group" aria-label="Hora do dia">
      <button type="button" data-hora="dia" aria-pressed="true">Dia</button>
      <button type="button" data-hora="entardecer" aria-pressed="false">Entardecer</button>
      <button type="button" data-hora="noite" aria-pressed="false">Noite</button>
    </div>
    <button id="novo" type="button">Variar plantio</button>
  </div>
  <p class="dica" id="info">Semente 1234</p>
</section>

<div id="carregando" role="status" aria-live="polite">
  <div class="caixa">
    <h2>JARDIM DOS BIOMAS</h2>
    <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="barra"></div></div>
    <p id="etapa">Baixando o motor 3D…</p>
    <p id="erro" hidden></p>
  </div>
</div>
